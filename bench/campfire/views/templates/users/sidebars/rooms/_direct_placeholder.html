{% filter button_to(h::rooms_directs_with_user(user.id), h::attrs().class("direct borderless fill-transparent unpad")) %}
  <span class="avatar">
    {{ h::image_tag(ctx, user.avatar_path.as_str(), h::attrs().aria_hidden()) }}
  </span>

  <span class="direct__author flex align-center gap max-width min-width border-radius txt-small">
    <span class="txt-nowrap overflow-ellipsis">
      <span class="for-screen-reader">Start a ping with</span>
      {{ user.first_name() }}
    </span>
  </span>
{% endfilter %}
